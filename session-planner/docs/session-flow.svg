<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc"><ns0:title id="title">Session Studio · planning flow</ns0:title><ns0:desc id="desc">Session intake, generation, agenda review, approval and export with separate intake, timing and method replacement edit paths and source readiness rules.</ns0:desc><ns0:defs><ns0:marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M0 0 L9 4.5 L0 9 Z" fill="#71839c" /></ns0:marker></ns0:defs><ns0:rect width="1800" height="1160" fill="#f3f5f9" /><ns0:g font-family="Segoe UI,Arial,sans-serif" fill="#17243a"><ns0:text x="64" y="61" font-size="32" font-weight="650">Session Studio · planning flow</ns0:text><ns0:text x="64" y="98" font-size="18" fill="#546277">Implemented policy · Intake → editable agenda → approved handoff · Plus slots add methods or session steps</ns0:text><ns0:text x="64" y="393" font-size="22" font-weight="650">FROM AGENDA REVIEW · choose an edit, then return to review</ns0:text><ns0:text x="64" y="427" font-size="16" font-weight="600">INTAKE CHANGES</ns0:text><ns0:text x="560" y="427" font-size="16" font-weight="600">TIMING CHANGES</ns0:text><ns0:text x="1056" y="427" font-size="16" font-weight="600">METHOD CHANGES</ns0:text><ns0:g id="intake"><ns0:rect x="64" y="140" width="304" height="194" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="82" y="172" font-size="20" font-weight="650">1  SESSION INTAKE</ns0:text><ns0:text x="82" y="205" font-size="18" fill="#546277">Name + optional context</ns0:text><ns0:text x="82" y="229" font-size="18" fill="#546277">Phase, goal, time, participants</ns0:text><ns0:text x="82" y="253" font-size="18" fill="#546277">Experience + demo mode</ns0:text><ns0:text x="82" y="277" font-size="18" fill="#546277">Goal/phase advisory:</ns0:text><ns0:text x="82" y="301" font-size="18" fill="#546277">change it or continue anyway.</ns0:text></ns0:g><ns0:g id="generate"><ns0:rect x="406" y="140" width="304" height="194" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="424" y="172" font-size="20" font-weight="650">2  MAKE PLAN</ns0:text><ns0:text x="424" y="205" font-size="18" fill="#546277">Validate intake + readiness.</ns0:text><ns0:text x="424" y="229" font-size="18" fill="#546277">Match phase, goal, group, level.</ns0:text><ns0:text x="424" y="253" font-size="18" fill="#546277">Add methods + session steps.</ns0:text><ns0:text x="424" y="277" font-size="18" fill="#546277">If infeasible: show error;</ns0:text><ns0:text x="424" y="301" font-size="18" fill="#546277">keep intake / edited plan.</ns0:text></ns0:g><ns0:g id="review"><ns0:rect x="748" y="140" width="304" height="194" rx="12" fill="#edf2ff" stroke="#dbe1ea" /><ns0:text x="766" y="172" font-size="20" font-weight="650">3  REVIEW AGENDA</ns0:text><ns0:text x="766" y="205" font-size="18" fill="#546277">Expand methods + steps.</ns0:text><ns0:text x="766" y="229" font-size="18" fill="#546277">Swap steps; remove + Undo.</ns0:text><ns0:text x="766" y="253" font-size="18" fill="#546277">Plus slots add blocks.</ns0:text><ns0:text x="766" y="277" font-size="18" fill="#546277">Other blocks stay unchanged.</ns0:text><ns0:text x="766" y="301" font-size="18" fill="#546277">Device-local draft restoration.</ns0:text></ns0:g><ns0:g id="approve"><ns0:rect x="1090" y="140" width="304" height="194" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="1108" y="172" font-size="20" font-weight="650">4  CONFIRM PLANNING</ns0:text><ns0:text x="1108" y="205" font-size="18" fill="#546277">Create a deep-copy snapshot.</ns0:text><ns0:text x="1108" y="229" font-size="18" fill="#546277">Include accepted warnings and</ns0:text><ns0:text x="1108" y="253" font-size="18" fill="#546277">remaining constraints.</ns0:text><ns0:text x="1108" y="277" font-size="18" fill="#546277">Accepts excess time or</ns0:text><ns0:text x="1108" y="301" font-size="18" fill="#546277">participant mismatch.</ns0:text></ns0:g><ns0:g id="handoff"><ns0:rect x="1432" y="140" width="304" height="194" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="1450" y="172" font-size="20" font-weight="650">5  APPROVED HANDOFF</ns0:text><ns0:text x="1450" y="205" font-size="18" fill="#546277">Read-only time; details expand.</ns0:text><ns0:text x="1450" y="229" font-size="18" fill="#546277">Download Markdown plan.</ns0:text><ns0:text x="1450" y="253" font-size="18" fill="#546277">Editing clears approval.</ns0:text><ns0:text x="1450" y="277" font-size="18" fill="#546277">Live running screen and</ns0:text><ns0:text x="1450" y="301" font-size="18" fill="#546277">Session Chief pending.</ns0:text></ns0:g><ns0:g id="intake_edit"><ns0:rect x="64" y="444" width="448" height="180" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="82" y="476" font-size="20" font-weight="650">LEFT PANEL  ·  EDIT INTAKE</ns0:text><ns0:text x="82" y="509" font-size="18" fill="#546277">Draft edits do not change the agenda.</ns0:text><ns0:text x="82" y="533" font-size="18" fill="#546277">Close / Escape: discard intake draft;</ns0:text><ns0:text x="82" y="557" font-size="18" fill="#546277">the current plan stays unchanged.</ns0:text><ns0:text x="82" y="581" font-size="18" fill="#546277">Confirm: regenerate from changed intake.</ns0:text><ns0:text x="82" y="605" font-size="18" fill="#546277">Advisory goal/phase warning allows continue.</ns0:text></ns0:g><ns0:g id="intake_return"><ns0:rect x="64" y="662" width="448" height="108" rx="12" fill="#edf2ff" stroke="#dbe1ea" /><ns0:text x="82" y="694" font-size="20" font-weight="650">RETURN TO AGENDA REVIEW</ns0:text><ns0:text x="82" y="727" font-size="18" fill="#546277">Success replaces the plan.</ns0:text><ns0:text x="82" y="751" font-size="18" fill="#546277">Failure keeps current plan + shows error.</ns0:text></ns0:g><ns0:g id="time_edit"><ns0:rect x="560" y="444" width="448" height="218" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="578" y="476" font-size="20" font-weight="650">MANUAL TIME EDIT</ns0:text><ns0:text x="578" y="509" font-size="18" fill="#546277">Method minimum = ceil(60% of default).</ns0:text><ns0:text x="578" y="533" font-size="18" fill="#546277">Also allow at least 1 minute per step.</ns0:text><ns0:text x="578" y="557" font-size="18" fill="#546277">Session organisation minimum = 1 minute.</ns0:text><ns0:text x="578" y="581" font-size="18" fill="#546277">Whole-method edit redistributes step times.</ns0:text><ns0:text x="578" y="605" font-size="18" fill="#546277">Step edit changes that step + method total.</ns0:text><ns0:text x="578" y="629" font-size="18" fill="#546277">Invalid edit: error; activity stays unchanged.</ns0:text></ns0:g><ns0:g id="time_return"><ns0:rect x="560" y="712" width="448" height="154" rx="12" fill="#edf2ff" stroke="#dbe1ea" /><ns0:text x="578" y="744" font-size="20" font-weight="650">RETURN TO AGENDA REVIEW</ns0:text><ns0:text x="578" y="777" font-size="18" fill="#546277">Only edited activity / timing changes.</ns0:text><ns0:text x="578" y="801" font-size="18" fill="#546277">Recalculate elapsed time and total.</ns0:text><ns0:text x="578" y="825" font-size="18" fill="#546277">If over budget: total warning only.</ns0:text><ns0:text x="578" y="849" font-size="18" fill="#546277">No regeneration or replacement dialog.</ns0:text></ns0:g><ns0:g id="choices"><ns0:rect x="1056" y="444" width="680" height="146" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="1074" y="476" font-size="19" font-weight="650">RIGHT PANEL  ·  CHOOSE A REPLACEMENT</ns0:text><ns0:text x="1074" y="509" font-size="17" fill="#546277">Novice: up to 3 eligible, easy, same-category, budget-fitting alternatives.</ns0:text><ns0:text x="1074" y="533" font-size="17" fill="#546277">Bachelor: up to 3 recommendations + remaining same-category records.</ns0:text><ns0:text x="1074" y="557" font-size="17" fill="#546277">Master: all other methods across categories; no recommendations.</ns0:text><ns0:text x="1074" y="581" font-size="17" fill="#546277">Every candidate expands; ready procedures include nested step details.</ns0:text></ns0:g><ns0:g id="replace"><ns0:rect x="1056" y="628" width="680" height="100" rx="12" fill="#ffffff" stroke="#dbe1ea" /><ns0:text x="1074" y="660" font-size="20" font-weight="650">REPLACE BUTTON OR DRAG TO SELECTED METHOD</ns0:text><ns0:text x="1074" y="693" font-size="18" fill="#546277">Ready methods only. Replace the target at its catalogue default duration.</ns0:text><ns0:text x="1074" y="717" font-size="18" fill="#546277">Other activities stay unchanged. Close without choosing keeps the plan.</ns0:text></ns0:g><ns0:g id="warning"><ns0:rect x="1056" y="766" width="680" height="104" rx="12" fill="#fff6e2" stroke="#dbe1ea" /><ns0:text x="1074" y="798" font-size="20" font-weight="650">PARTICIPANT MISMATCH OR TOTAL OVER BUDGET?</ns0:text><ns0:text x="1074" y="831" font-size="18" fill="#546277">Bachelor / Master: show warning after the replacement is applied.</ns0:text><ns0:text x="1074" y="855" font-size="18" fill="#546277">No constraint warning (including eligible Novice choice): return to review.</ns0:text></ns0:g><ns0:g id="dismiss"><ns0:rect x="1056" y="906" width="280" height="126" rx="12" fill="#edf2ff" stroke="#dbe1ea" /><ns0:text x="1074" y="938" font-size="20" font-weight="650">DISMISS</ns0:text><ns0:text x="1074" y="971" font-size="18" fill="#546277">Retain the replacement.</ns0:text><ns0:text x="1074" y="995" font-size="18" fill="#546277">Record accepted warning.</ns0:text><ns0:text x="1074" y="1019" font-size="18" fill="#546277">Return to agenda review.</ns0:text></ns0:g><ns0:g id="rebuild"><ns0:rect x="1370" y="906" width="366" height="150" rx="12" fill="#edf2ff" stroke="#dbe1ea" /><ns0:text x="1388" y="938" font-size="20" font-weight="650">REBUILD · PIN THIS METHOD</ns0:text><ns0:text x="1388" y="971" font-size="18" fill="#546277">Pin chosen method; participants fixed.</ns0:text><ns0:text x="1388" y="995" font-size="18" fill="#546277">Available time may grow to fit.</ns0:text><ns0:text x="1388" y="1019" font-size="18" fill="#546277">Success: new plan → review.</ns0:text><ns0:text x="1388" y="1043" font-size="18" fill="#546277">Infeasible: error; edited plan retained.</ns0:text></ns0:g><ns0:g id="catalogue"><ns0:rect x="64" y="908" width="944" height="156" rx="12" fill="#f9fafc" stroke="#dbe1ea" /><ns0:text x="82" y="940" font-size="20" font-weight="650">METHOD LIBRARY  ·  SOURCE READINESS</ns0:text><ns0:text x="82" y="973" font-size="17" fill="#546277">Ready = verified procedure + at least one step + default minutes + minimum participants + difficulty.</ns0:text><ns0:text x="82" y="997" font-size="17" fill="#546277">A blank maximum means no upper limit. Incomplete records remain visible but cannot be selected.</ns0:text><ns0:text x="82" y="1021" font-size="17" fill="#546277">Metadata saves durably on the server and affects future plans; current durations remain unchanged.</ns0:text><ns0:text x="82" y="1045" font-size="17" fill="#546277">Title-only records still need recovered procedures. Demo ratings are separate, labelled estimates.</ns0:text></ns0:g><ns0:path d="M 370 237 H 400" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 712 237 H 742" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 1054 237 H 1084" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 1396 237 H 1426" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 288 626 V 656" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 784 664 V 706" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 1396 592 V 622" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 1396 730 V 760" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 1396 872 V 886 H 1196 V 900" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:path d="M 1396 872 V 886 H 1553 V 900" fill="none" stroke="#71839c" stroke-width="2" marker-end="url(#arrow)" /><ns0:text x="64" y="1115" font-size="16" fill="#546277">Policy source: lib/engine.ts · app/studio.tsx · PRODUCT.md · Method readiness: lib/catalogue.ts</ns0:text></ns0:g></ns0:svg>